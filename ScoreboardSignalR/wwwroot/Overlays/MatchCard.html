<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=2560, initial-scale=1.0">
    <title>Match Card Overlay</title>
    <link rel="stylesheet" href="./MatchCard.css">
</head>
<body>

<div class="fight-card" id="fightCard">

    <!-- ═══════════════════════════════
         MAIN CARD
    ═══════════════════════════════ -->
    <div class="section-group" id="sectionMain">
        <div class="section-header section-main">Main Card</div>
        <div class="section-fights" id="fights-main">
            <!-- Rows dynamically generated by MatchCard.js -->
        </div>
    </div><!-- /sectionMain -->

    <!-- ═══════════════════════════════
         PRELIMS
    ═══════════════════════════════ -->
    <div class="section-group" id="sectionPrelims">
        <div class="section-header section-prelims">Prelims</div>
        <div class="section-fights" id="fights-prelims">
            <!-- Rows dynamically generated by MatchCard.js -->
        </div>
    </div><!-- /sectionPrelims -->

    <!-- ═══════════════════════════════
         EARLY PRELIMS
    ═══════════════════════════════ -->
    <div class="section-group" id="sectionEarly">
        <div class="section-header section-early">Early Prelims</div>
        <div class="section-fights" id="fights-early">
            <!-- Rows dynamically generated by MatchCard.js -->
        </div>
    </div><!-- /sectionEarly -->

</div><!-- /fight-card -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/7.0.5/signalr.min.js"></script>
<script src="./MatchCard.js"></script>
</body>
</html>
